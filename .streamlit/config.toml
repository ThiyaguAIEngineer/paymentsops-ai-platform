[theme]
base = "light"
primaryColor = "#345D83"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#EAF0F6"
textColor = "#183047"
font = "sans serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.55rem", "1.2rem", "1rem", "1rem", "1rem"]
borderColor = "#CCD7E3"
baseRadius = "medium"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EFF3F8"
