[project]
name = "payment-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.7.1",
    "numpy>=2.5.4",
    "rank-bm25>=0.2.2",
    "streamlit>=1.65.0",
]

[project.scripts]
payment-ops = "payment_ops:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
